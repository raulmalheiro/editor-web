<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
  <script>
    let worker = null;

    function startWorker() {
      if (worker) worker.terminate();

      // Instancia o Worker estático puro. Sem passar {type: 'module'}
      // O navegador o trata obrigatoriamente como script clássico!
      worker = new Worker('/python.worker.js');

      worker.onmessage = (e) => {
        window.parent.postMessage(e.data, '*');
      };
      
      // Inicializa a VM do Python
      worker.postMessage({ type: 'INIT' });
    }

    window.addEventListener('message', (e) => {
      if (e.data.type === 'RUN') {
        if (worker) worker.postMessage({ type: 'RUN', code: e.data.code });
      } else if (e.data.type === 'INIT') {
        startWorker();
      }
    });
  </script>
</body>
</html>
