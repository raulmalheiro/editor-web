<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
  <script>
    let worker = null;

    function startWorker() {
      if (worker) worker.terminate();
      
      import('/src/lua.worker.js?worker&type=module').then((WorkerModule) => {
        worker = new WorkerModule.default();
        
        // CORREÇÃO: Garante que TODO o objeto vindo do worker (com o tipo, saída e lang)
        // seja enviado de volta para o componente React
        worker.onmessage = (e) => {
          window.parent.postMessage(e.data, '*');
        };
        
      }).catch(err => {
        window.parent.postMessage({ type: 'ERROR', error: 'Falha ao carregar o Worker: ' + err.message, lang: 'lua' }, '*');
      });
    }

    window.addEventListener('message', (e) => {
      if (e.data.type === 'RUN') {
        if (worker) worker.postMessage({ type: 'RUN', code: e.data.code });
      } else if (e.data.type === 'INIT') {
        startWorker();
      }
    });
  </script>
</body>
</html>
